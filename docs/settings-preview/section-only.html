<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅途设置 · 云上之约</title>
<style>
:root{--ground:#edf2ec;--paper:#fcfcf6;--ink:#254d58;--muted:#526960;--line:#dce3d6;--accent:#547a70;--gold:#7b7049}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 'Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}header{height:112px;margin:0 48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:32px}.brand{display:flex;align-items:center;gap:18px}.mark{width:48px;height:48px;color:var(--gold)}.brand strong{font:26px 'SimSun',serif;letter-spacing:5px}.brand small{display:block;font:11px SimSun,serif;letter-spacing:2px;margin-top:8px;color:var(--gold)}.topright{flex-shrink:0;display:flex;align-items:center;gap:34px}.account{display:flex;gap:18px;align-items:center}.avatar{width:36px;height:36px;border:1px solid #a8b8a5;border-radius:50%;display:grid;place-items:center}.account small,.player small{display:block;color:var(--muted);font-size:11px}.account strong{font-size:14px}.stats{white-space:nowrap;font:18px SimSun,serif;padding-left:24px;border-left:1px solid var(--line)}.stats small{display:inline;font:11px 'Microsoft YaHei',sans-serif}.player{padding-left:28px;border-left:1px solid var(--line);display:flex;gap:16px;align-items:center}.player b{font:16px 'SimSun',serif;letter-spacing:2px}.plain{background:none;border:0;padding:8px}.wrap{max-width:1080px;margin:42px auto 30px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font:600 32px 'SimSun',serif;letter-spacing:3px;margin:0 0 10px}p{margin:0;color:var(--muted);font-size:13px}.back{border:1px solid #bcc8b9;background:transparent;border-radius:4px;padding:11px 20px;font-size:13px}.back:hover{background:#e1e9df}.sheet{background:var(--paper);border:1px solid #d8dfd0;border-radius:6px;padding:8px 36px}section{display:grid;grid-template-columns:210px 1fr;gap:30px;padding:28px 0}section+section{border-top:1px solid var(--line)}h2{font-size:17px;margin:0 0 8px;font-weight:600}.intro p{font-size:12px;line-height:1.8}.audio{display:grid;grid-template-columns:1fr 1fr;gap:28px}.volume{min-width:0}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.label span{font-size:14px}.label output{font:22px SimSun,serif;font-variant-numeric:tabular-nums}.label output small{font-size:12px;margin-left:3px;color:var(--muted)}input[type=range]{appearance:none;width:100%;height:5px;border-radius:5px;display:block;margin:0;cursor:pointer;background:#dce4da}input[type=range]::-webkit-slider-thumb{appearance:none;height:15px;width:15px;background:var(--paper);border:4px solid var(--accent);border-radius:50%}.range{position:relative}.fill{position:absolute;height:5px;background:var(--accent);border-radius:5px;top:0;pointer-events:none}.range input{position:relative;background:transparent}.range:before{content:'';position:absolute;inset:0;background:#dce4da;border-radius:5px}.muterow{display:flex;align-items:center;justify-content:space-between;margin-top:20px;font-size:12px;color:var(--muted)}.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;position:relative}.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0}.toggle{width:34px;height:19px;border-radius:20px;background:#d8dfd6;display:block;position:relative}.toggle:after{content:'';position:absolute;top:3px;left:3px;width:13px;height:13px;background:#fff;border-radius:50%;transition:transform .15s}.switch input:checked+.toggle{background:var(--accent)}.switch input:checked+.toggle:after{transform:translateX(15px)}.switch input:focus-visible+.toggle{outline:2px solid var(--ink);outline-offset:3px}.musicoptions{display:flex;gap:32px;padding-top:22px;margin-top:24px;border-top:1px solid var(--line);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.row+.row{margin-top:24px;padding-top:23px;border-top:1px solid var(--line)}.row strong{font-size:14px;font-weight:400}.row p{font-size:12px;margin-top:5px}.segments{display:flex;gap:3px;background:#edf0e8;padding:4px;border-radius:4px}.segments button{border:0;background:transparent;font-size:13px;width:57px;height:31px;border-radius:3px}.segments button.selected{background:var(--paper);color:var(--ink);outline:1px solid #bdcbb8}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:#4d7163}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:#668570}.footnote{display:flex;justify-content:space-between;padding-top:17px;font-size:12px;color:var(--muted)}footer{margin:35px 48px 0;padding:22px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}footer em{font-family:'SimSun';font-style:normal}.end{font-family:SimSun,serif;letter-spacing:2px}@media(min-width:1500px){.wrap{margin-top:60px}}@media(max-width:1150px){.wrap{margin:32px 32px}.stats{display:none}header{margin:0 32px}.topright{gap:12px}}@media(max-width:700px){header{height:86px;margin:0 20px}.brand strong{font-size:20px}.brand small{font-size:9px}.mark{width:32px}.account,.player{display:none}.wrap{margin:30px 20px}.title{gap:14px}h1{font-size:26px}.title p{font-size:12px}.back{white-space:nowrap;padding:9px 12px}.sheet{padding:0 20px}section{grid-template-columns:1fr;gap:20px;padding:24px 0}.audio{gap:24px}.label output{font-size:20px}.row{gap:12px}.segments button{width:35px}.musicoptions{gap:22px}footer{margin:28px 20px}.end{display:none}.footnote{gap:12px;font-size:11px}}
body{height:100vh;min-height:900px;background:url("original-page.png") center/100% 100% no-repeat}.wrap{position:absolute;top:16%;left:11%;width:78%;max-width:none;margin:0;background:#edf2ec;padding:14px 0 0}.sheet{padding:0 32px}section{padding:24px 0}.footnote{display:none}@media(max-width:700px){.wrap{left:5%;width:90%}} </style>

<main class="wrap"><div class="title"><div><h1>旅途设置</h1><p>调整声音与画面，让每一段旅途都恰如所愿。</p></div><button class="back">←　返回首页</button></div><div class="sheet">
<section><div class="intro"><h2>声音与音乐</h2><p>风声、旋律与每一次落子。<br>找到属于你的旅途音量。</p></div><div><div class="audio"><div class="volume"><div class="label"><span>背景音乐 <small> / BGM</small></span><output>70<small>%</small></output></div><div class="range"><div class="fill" style="width:70%"></div><input type="range" value="70" aria-label="BGM 音量"></div><div class="muterow"><span>BGM 静音</span><label class="switch"><input type="checkbox" aria-label="BGM 静音"><span class="toggle"></span></label></div></div><div class="volume"><div class="label"><span>游戏音效 <small> / SFX</small></span><output>80<small>%</small></output></div><div class="range"><div class="fill" style="width:80%"></div><input type="range" value="80" aria-label="SFX 音量"></div><div class="muterow"><span>SFX 静音</span><label class="switch"><input type="checkbox" aria-label="SFX 静音"><span class="toggle"></span></label></div></div></div><div class="musicoptions"><label class="switch"><input type="checkbox" checked><span class="toggle"></span>自动切歌</label><label class="switch"><input type="checkbox" checked><span class="toggle"></span>单曲循环</label></div></div></section>
<section><div class="intro"><h2>画面与镜头</h2><p>远山与云海，尽收眼底。</p></div><div><div class="row"><div><strong>画质特效</strong><p>调整场景中的视觉效果。</p></div><div class="segments" aria-label="画质特效"><button>低</button><button>中</button><button class="selected">高</button></div></div><div class="row"><div><strong>镜头自动跟随</strong><p>镜头随当前角色移动。</p></div><label class="switch"><input type="checkbox" checked aria-label="镜头自动跟随"><span class="toggle"></span></label></div></div></section>
<section><div class="intro"><h2>账号内容</h2><p>与你一同启程的珍藏。</p></div><div class="row"><div><strong>隐藏角色</strong><p>当前账号的角色解锁状态。</p></div><span class="status">已解锁</span></div></section>
</div><div class="footnote"><span>设置保存在当前浏览器</span><span>当前账号　impurewine</span></div></main>
<script>document.querySelectorAll('input[type=range]').forEach(el=>el.oninput=()=>{el.previousElementSibling.style.width=el.value+'%';el.closest('.volume').querySelector('output').innerHTML=el.value+'<small>%</small>'});document.querySelectorAll('.segments button').forEach(el=>el.onclick=()=>{document.querySelector('.selected').classList.remove('selected');el.classList.add('selected')});</script></html>
